<header class="select-page__header">
  <h1 class="select-page__title">Select</h1>
  <p class="select-page__description">
    Combobox accesible e integrado con Angular Forms, con soporte para tamaños, estados y los eventos
    <code>valueChange</code>, <code>opened</code> y <code>closed</code>.
  </p>
</header>

<div class="select-page__docs">
  <app-code-block label="Instalación" language="bash" code="npm install &#64;halo-ui/angular &#64;angular/cdk" />
  <app-code-block
    label="Importación"
    language="typescript"
    code="import { HaSelect } from '&#64;halo-ui/angular';
import type { HaSelectOption } from '&#64;halo-ui/angular';"
  />
  <app-code-block
    label="Uso básico"
    language="html"
    code='&lt;ha-select
  [options]="options"
  size="md"
  placeholder="Elegí una opción"
  (valueChange)="onValueChange($event)"
/&gt;'
  />
</div>

<section class="select-page__section">
  <h2>Sizes</h2>
  <div class="select-page__row">
    @for (size of sizes; track size) {
      <ha-select [options]="fruitOptions" [size]="size" placeholder="Choose a fruit" />
    }
  </div>
</section>

<section class="select-page__section">
  <h2>States</h2>
  <div class="select-page__row">
    <ha-select [options]="fruitOptions" [disabled]="true" placeholder="Disabled" />
    <ha-select [options]="fruitOptions" [readonly]="true" placeholder="Read-only" />
  </div>
</section>

<section class="select-page__section">
  <h2>Events</h2>
  <div class="select-page__row">
    <ha-select
      [options]="fruitOptions"
      placeholder="Choose a fruit"
      (valueChange)="onValueChange($event)"
      (opened)="onOpened()"
      (closed)="onClosed()"
    />
  </div>
  <p>Selected value: {{ selectedValue() }}</p>
  <p>Panel open: {{ panelOpen() }}</p>
</section>
