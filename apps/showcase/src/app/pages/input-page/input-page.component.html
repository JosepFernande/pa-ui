<header class="input-page__header">
  <h1 class="input-page__title">InputText</h1>
  <p class="input-page__description">
    Campo de texto accesible, integrado con Angular Forms, con soporte para tamaños, estado deshabilitado/solo lectura y
    binding de dos vías.
  </p>
</header>

<div class="input-page__docs">
  <app-code-block label="Instalación" language="bash" code="npm install &#64;halo-ui/angular &#64;angular/cdk" />
  <app-code-block
    label="Importación"
    language="typescript"
    code="import { HaInput } from '&#64;halo-ui/angular';
import { FormsModule } from '&#64;angular/forms';"
  />
  <app-code-block
    label="Uso básico"
    language="html"
    code='&lt;input ha-input size="md" placeholder="Escribí algo" [(ngModel)]="value" /&gt;'
  />
</div>

<section class="input-page__section">
  <h2>Sizes</h2>
  <div class="input-page__row">
    @for (size of sizes; track size) {
      <input ha-input [size]="size" [placeholder]="size" />
    }
  </div>
</section>

<section class="input-page__section">
  <h2>States</h2>
  <div class="input-page__row">
    <input ha-input placeholder="Disabled" [disabled]="true" />
    <input ha-input placeholder="Read-only" [readonly]="true" value="Read-only value" />
  </div>
</section>

<section class="input-page__section">
  <h2>Two-way binding</h2>
  <div class="input-page__row">
    <input ha-input placeholder="Type something" name="demoInput" [(ngModel)]="boundValue" />
    <p>Current value: {{ boundValue }}</p>
  </div>
</section>
