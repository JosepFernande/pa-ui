<section class="button-page__section">
  <h2>Variants</h2>
  <div class="button-page__row">
    @for (variant of variants; track variant) {
      <button pa-button [variant]="variant">{{ variant }}</button>
    }
  </div>
</section>

<section class="button-page__section">
  <h2>Sizes</h2>
  <div class="button-page__row">
    @for (size of sizes; track size) {
      <button pa-button [size]="size">{{ size }}</button>
    }
  </div>
</section>

<section class="button-page__section">
  <h2>Colors</h2>
  <div class="button-page__row">
    @for (color of colors; track color) {
      <button pa-button [color]="color">{{ color }}</button>
    }
  </div>
</section>

<section class="button-page__section">
  <h2>States</h2>
  <div class="button-page__row">
    <button pa-button [disabled]="true">Disabled</button>
    <button pa-button [loading]="true">Loading</button>
  </div>
</section>
