name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-${{ runner.os }}-

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npx nx run-many -t lint

  stylelint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npx nx run-many -t stylelint

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npx nx run-many -t test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npx nx run-many -t build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npx tsx tools/audit/index.ts
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: tools/audit/report.json

  gga-review:
    needs: setup
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Install opencode
        run: |
          curl -fsSL https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/opencode
      - name: Install gga
        run: |
          git clone --depth 1 https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          # Upstream caps the STATUS: PASSED/FAILED lookahead at 30 lines (bin/gga).
          # The opencode agent's own tool-call transcript (skill loads, find/glob/
          # read calls) routinely pushes the real verdict past that, so gga reports
          # "Could not determine review status" on perfectly clear responses.
          # Widen the window until upstream fixes the parser.
          sed -i 's/parse_review_status "\$RESULT" 30/parse_review_status "$RESULT" 200/' /tmp/gga/bin/gga
          bash /tmp/gga/install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Ensure base branch is fetched locally
        run: |
          git fetch --force origin "${{ github.base_ref }}:refs/heads/${{ github.base_ref }}"
          echo "--- diagnostic ---"
          git rev-parse --verify "${{ github.base_ref }}"
          git rev-parse HEAD
          git merge-base "${{ github.base_ref }}" HEAD
          git diff --name-only "${{ github.base_ref }}...HEAD"
      - name: Run gga PR review
        id: gga_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set +e
          gga run --pr-mode --ci 2>&1 | tee /tmp/gga-review.log
          exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
      - name: Comment gga review on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Strip ANSI color/cursor codes — GitHub markdown renders them as
          # garbled literal escape sequences instead of colors.
          sed -i 's/\x1b\[[0-9;]*[mK]//g' /tmp/gga-review.log

          {
            echo "### 🤖 Gentleman Guardian Angel — PR review"
            echo ""
            if [[ "${{ steps.gga_review.outputs.exit_code }}" == "0" ]]; then
              echo "**Result:** ✅ PASSED"
            else
              echo "**Result:** ❌ FAILED (exit code ${{ steps.gga_review.outputs.exit_code }})"
            fi
            echo ""
            # Everything from the STATUS: line onward is the actual verdict —
            # show it inline instead of burying it under the agent's tool-call trace.
            awk '/^STATUS:/{p=1; next} p' /tmp/gga-review.log
            echo ""
            echo "<details><summary>Full gga output (setup + agent trace)</summary>"
            echo ""
            echo '```'
            cat /tmp/gga-review.log
            echo '```'
            echo "</details>"
          } > /tmp/gga-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/gga-comment.md

  summary:
    needs: [lint, stylelint, test, build, audit, gga-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.stylelint.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" || \
                "${{ needs.audit.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
