name: Smoke

# Post-merge smoke build. The full CI pipeline already ran on the PR, and
# branch protection requires strict: true (the PR branch must be up to date
# with main before merging), so the commit reaching main was validated in
# exactly that state. Re-running lint/stylelint/test/audit on push would be
# pure duplication. This single lightweight job only verifies what the PR
# could not: environment-level failures (registry down, rotated secret,
# runner drift) that are independent of the code.
on:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: '0'
      # Workaround temporal (ver issue #146): package-lock.json solo retiene
      # metadata resuelta del binario nativo de lightningcss para la plataforma
      # que corrió npm install por última vez (Windows), así que npm ci en
      # Linux no puede resolver lightningcss-linux-x64-gnu. A diferencia de
      # esbuild, lightningcss no tiene un postinstall de fallback que lo
      # descargue solo. Forzamos la instalación explícita del binario correcto
      # sin tocar el lockfile.
      - name: Fix missing lightningcss native binary on Linux CI
        run: |
          LC_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/lightningcss'].version")
          npm install --no-save --no-audit --no-fund "lightningcss@${LC_VERSION}"
      # Workaround temporal (ver issue #146): mismo problema que lightningcss,
      # pero con @tailwindcss/oxide (dependencia nativa de @tailwindcss/postcss,
      # usada por el pipeline de Angular/PostCSS al compilar). El lockfile solo
      # tiene resuelto el binario win32-x64-msvc; forzamos la instalación
      # explícita del binario linux-x64-gnu sin tocar el lockfile.
      - name: Fix missing @tailwindcss/oxide native binary on Linux CI
        run: |
          OXIDE_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide'].version")
          npm install --no-save --no-audit --no-fund "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VERSION}"
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npx nx run-many -t build
