name: Release

on:
  push:
    branches: [main]
    paths:
      # Only run when the push can change a release outcome. A docs-only
      # merge would otherwise burn a full npm ci + build + audit for nothing.
      # The version-packages PR merge touches libs/*/package.json and
      # libs/*/CHANGELOG.md, so libs/** must stay covered — the "Check for
      # changesets" step remains the single source of truth for whether this
      # run actually publishes.
      - 'libs/**'
      - '.changeset/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Normal runs take 3-5 min; 30 min covers worst case without letting a
    # hung npm ci/publish block the release-main concurrency for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          # Needed before anything creates an annotated tag (`git tag -m`)
          # in this job — the publish loop below tags each package manually
          # and the release tag step does too. Without it, `git tag -m` fails
          # with "Committer identity unknown" (exit 128) and the tags just
          # never get created.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: npm ci
        env:
          HUSKY: '0'

      - name: Build
        run: npx nx run-many -t build

      - name: Check for changesets
        id: changesets
        run: |
          # In prerelease mode (.changeset/pre.json present), `changeset version`
          # intentionally never deletes consumed .md files, so a plain `ls` always
          # finds them. A changeset only counts as pending if it isn't yet listed
          # in pre.json's `changesets` array (which mirrors the last `version` run).
          md_ids=$(ls .changeset/*.md 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/\.md$//' | grep -vx 'README' || true)

          if [ -f .changeset/pre.json ]; then
            pending=$(comm -23 <(echo "$md_ids" | sed '/^$/d' | sort -u) <(jq -r '.changesets[]' .changeset/pre.json | sort -u))
          else
            pending="$md_ids"
          fi

          if [ -n "$pending" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npx changeset version

      - name: Create Release Pull Request
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): version packages'
          title: 'chore(release): version packages'
          body: |
            This PR was auto-generated by the release workflow.

            It contains version bumps and CHANGELOG updates from pending changesets.

            **Do not squash or rebase this PR — merge it as-is.**

            Once merged, the release workflow will publish the new versions to npm automatically.
          branch: release/version-packages
          branch-suffix: short-commit-hash
          base: main

      - name: Audit production dependencies
        if: steps.changesets.outputs.has_changesets == 'false'
        # Non-blocking by design: an advisory unrelated to the change being
        # published must not kill the release. The exit code is recorded as a
        # failed step (visible in the run) but never blocks the publish — the
        # report is uploaded as an artifact so the finding stays actionable.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical --json > /tmp/npm-audit-report.json

      - name: Upload npm audit report
        if: steps.changesets.outputs.has_changesets == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: /tmp/npm-audit-report.json
          if-no-files-found: ignore

      - name: Publish to npm from dist
        id: publish
        if: steps.changesets.outputs.has_changesets == 'false'
        run: |
          # Publish the real build output: the installable package (fesm
          # bundles + .d.ts + a package.json with proper entry points) only
          # exists under dist/{projectRoot}, produced by the "Build" step
          # above. Publishing the libs/* sources directly would ship a package
          # with no main/module/exports/typings. Each libs/*/package.json is
          # used purely as the source of truth for name + version, already
          # bumped by the prior `changeset version` run.
          #
          # No --tag is passed: none of these packages has had a real
          # non-prerelease release, so npm tags them `latest` by default. The
          # "Point the alpha dist-tag" step below moves `alpha` forward
          # afterward.
          : > /tmp/newly_published.txt
          published=false
          for src_pkg in libs/*/package.json; do
            lib_dir="$(dirname "$src_pkg")"
            dist_dir="dist/$lib_dir"
            [ -f "$dist_dir/package.json" ] || continue

            name="$(node -p "require('./$src_pkg').name")"
            version="$(node -p "require('./$src_pkg').version")"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip: ${name}@${version} already on npm"
              continue
            fi

            npm publish "$dist_dir" --access public
            git tag -a "${name}@${version}" -m "${name}@${version}"
            git push origin "${name}@${version}"

            echo "${name}@${version}" >> /tmp/newly_published.txt
            published=true
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Point the alpha dist-tag at what just published
        if: steps.publish.outputs.published == 'true' && hashFiles('.changeset/pre.json') != ''
        run: |
          # The publish loop above records every newly published
          # <name>@<version> in /tmp/newly_published.txt, one per line.
          # Because none of these packages has a prior non-prerelease
          # release, npm tagged them `latest` by default and `alpha` would go
          # stale. This step reads that list and explicitly moves the
          # prerelease dist-tag (alpha, from .changeset/pre.json) forward for
          # each one.
          alpha_tag="$(jq -r '.tag' .changeset/pre.json)"
          while IFS= read -r pkg_tag; do
            [ -n "$pkg_tag" ] || continue
            echo "npm dist-tag add \"$pkg_tag\" \"$alpha_tag\""
            npm dist-tag add "$pkg_tag" "$alpha_tag"
          done < /tmp/newly_published.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release tag
        if: steps.publish.outputs.published == 'true'
        run: |
          TAG="release-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
