name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: npm ci
        env:
          HUSKY: '0'

      - name: Build
        run: npx nx run-many -t build

      - name: Check for changesets
        id: changesets
        run: |
          # In prerelease mode (.changeset/pre.json present), `changeset version`
          # intentionally never deletes consumed .md files, so a plain `ls` always
          # finds them. A changeset only counts as pending if it isn't yet listed
          # in pre.json's `changesets` array (which mirrors the last `version` run).
          md_ids=$(ls .changeset/*.md 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/\.md$//' | grep -vx 'README' || true)

          if [ -f .changeset/pre.json ]; then
            pending=$(comm -23 <(echo "$md_ids" | sed '/^$/d' | sort -u) <(jq -r '.changesets[]' .changeset/pre.json | sort -u))
          else
            pending="$md_ids"
          fi

          if [ -n "$pending" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npx changeset version

      - name: Create Release Pull Request
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): version packages'
          title: 'chore(release): version packages'
          body: |
            This PR was auto-generated by the release workflow.

            It contains version bumps and CHANGELOG updates from pending changesets.

            **Do not squash or rebase this PR — merge it as-is.**

            Once merged, the release workflow will publish the new versions to npm automatically.
          branch: release/version-packages
          branch-suffix: short-commit-hash
          base: main

      - name: Audit production dependencies
        if: steps.changesets.outputs.has_changesets == 'false'
        run: npm audit --omit=dev --audit-level=critical

      - name: Publish to npm with changeset
        id: publish
        if: steps.changesets.outputs.has_changesets == 'false'
        run: |
          tag_flag=""
          if [ -f .changeset/pre.json ]; then
            tag_flag="--tag $(jq -r '.tag' .changeset/pre.json)"
          fi
          before_tags="$(git tag --list | sort)"
          set +e
          npx changeset publish $tag_flag
          publish_exit=$?
          set -e
          after_tags="$(git tag --list | sort)"
          if [ "$before_tags" != "$after_tags" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$publish_exit"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release tag
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="release-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
