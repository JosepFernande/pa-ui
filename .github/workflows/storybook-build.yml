name: Storybook Build

on:
  pull_request:
    paths:
      - 'apps/showcase/.storybook/**'
      - 'apps/showcase/**'
      - 'libs/*/src/lib/**/*.stories.ts'
      - 'libs/button/**'
      - 'libs/core/**'

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: '0'
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-${{ runner.os }}-
      - run: npx nx run showcase:build-storybook
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: dist/storybook/showcase/
          retention-days: 7
